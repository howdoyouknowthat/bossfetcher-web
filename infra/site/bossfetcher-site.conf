# BossFetcher 官网（帮你刷 boss）Nginx vhost。
# 放置到 /etc/nginx/conf.d/ 或 sites-available 后 `nginx -t && systemctl reload nginx`。
# 正式域名：www.bossfetcher.icu（主站）/ bossfetcher.icu（根域），证书覆盖三个 SAN。

# 安全响应头宏（在各 location 中逐一添加，因为 Nginx 子层 add_header 会覆盖父层）
map $request_uri $security_headers {
    default "Referrer-Policy: no-referrer; X-Content-Type-Options: nosniff; X-Frame-Options: DENY; Permissions-Policy: camera=(), microphone=(), geolocation=(); Content-Security-Policy: default-src 'self'; script-src 'self' https://stats.bossfetcher.icu; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://stats.bossfetcher.icu; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# 80 -> 443
server {
    listen 80;
    server_name www.bossfetcher.icu bossfetcher.icu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.bossfetcher.icu bossfetcher.icu;

    ssl_certificate     /etc/letsencrypt/live/bossfetcher.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bossfetcher.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/bossfetcher/web/current;
    index index.html;

    # ---- 缓存与安全头（每个 location 独立设置，避免子层覆盖丢失）----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.bossfetcher.icu; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://stats.bossfetcher.icu; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /bossfetcher.user.js {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /releases/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(install|help|privacy) {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.bossfetcher.icu; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://stats.bossfetcher.icu; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }

    location = /app {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files /app.html =404;
    }

    location /app/ {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /app.html =404;
    }

    location / {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.bossfetcher.icu; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://stats.bossfetcher.icu; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/bossfetcher-access.log main_min;
    error_log  /var/log/nginx/bossfetcher-error.log warn;
}

log_format main_min '$status $request_method $uri $body_bytes_sent $request_time $time_iso8601';