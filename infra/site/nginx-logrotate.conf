# 官网访问日志保留 7 天。放到 /etc/logrotate.d/bossfetcher
/srv/bossfetcher/logs/*.log /var/log/nginx/bossfetcher*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 $(cat /run/nginx.pid)
    endscript
}
