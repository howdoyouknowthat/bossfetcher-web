# BossFetcher 统计子域名（Umami）反向代理。
# stats.your-domain.example 是唯一的统计入口；Umami 只监听 127.0.0.1:3000。

# 80 -> 443
server {
    listen 80;
    server_name stats.your-domain.example;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name stats.your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---- 统计收集端点 ----
    # 采集请求不记录 access log（不落 IP/UA/query）；反向代理应关闭日志
    location = /api/collect {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    # tracker 脚本
    location = /bossfetcher-tracker.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /script.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Umami 管理后台 ----
    # 只允许管理员来源 IP；不满足时移除这段 allow 并改用其他受控访问方式。
    # 注意：顺序很重要，allow 在前、deny 在后。
    location / {
        # 仅示例 IP，替换为运维固定公网 IP；未配置时不开放管理后台
        # allow 203.0.113.10;
        deny all;
        return 403;
    }

    # 管理员来源 IP 放行后，代理到内部 Umami
    # location / {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    access_log /var/log/nginx/bossfetcher-stats.log main_min;
    error_log  /var/log/nginx/bossfetcher-stats-error.log warn;
}
