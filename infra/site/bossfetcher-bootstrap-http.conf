# BossFetcher 首次部署引导 vhost：签发三域 HTTP-01 证书前启用。
server {
    listen 80;
    listen [::]:80;
    server_name bossfetcher.icu www.bossfetcher.icu stats.bossfetcher.icu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
